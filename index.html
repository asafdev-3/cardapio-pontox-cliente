<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio | Dr. Espeto</title>
  <meta property="og:title" content="Cardápio Dr. Espeto">
  <meta property="og:description" content="Veja o cardápio em Várzea da Palma MG">
  <meta property="og:image" content="./assets/logo-dr-espeto.svg">
  <meta name="theme-color" content="#C9A84C">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="header">
    <img id="brand-logo" src="./assets/logo-dr-espeto.svg" class="logo" alt="Logo">
    <div>
      <h1 id="restaurant-name">Dr. Espeto</h1>
      <p id="restaurant-city">Várzea da Palma - MG</p>
    </div>
  </header>

  <main>
    <section id="categories" class="categories"></section>
    <section id="menu" class="menu"></section>
  </main>

  <footer class="footer">
    <button id="whatsapp-btn">🍔 Fazer Pedido</button>
  </footer>

  <div id="product-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close-x" id="close-product-btn">✕</button>
      <img id="product-img" class="modal-img" src="" alt="">
      <h2 id="product-name"></h2>
      <p id="product-description"></p>
      <div id="product-price" class="modal-price"></div>
      <div class="qty-controls">
        <button id="minus-qty">−</button>
        <span id="product-qty">1</span>
        <button id="plus-qty">+</button>
      </div>
      <button id="add-product-btn" class="btn-primary">Adicionar ao Pedido</button>
    </div>
  </div>

  <div id="order-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close-x" id="close-modal-btn">✕</button>
      <h2>Seu Pedido</h2>
      <div id="order-items"></div>

      <div class="form-section">
        <label class="form-label">Seu nome</label>
        <input type="text" id="customer-name" placeholder="Ex: João Silva">
      </div>

      <div class="form-section">
        <label class="form-label">Forma de pagamento</label>
        <select id="payment-method">
          <option value="">Selecione...</option>
          <option value="PIX">PIX</option>
          <option value="Cartão">Cartão</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
      </div>

      <div id="troco-box" class="form-section" style="display:none">
        <label class="form-label">Troco para quanto?</label>
        <input type="number" id="troco-valor" placeholder="Ex: 100" inputmode="numeric">
      </div>

      <div class="form-section">
        <label class="form-label">Retirada ou entrega?</label>
        <div class="delivery-toggle">
          <button class="delivery-btn active" id="btn-retirada" onclick="setDelivery('Retirada')">Retirada</button>
          <button class="delivery-btn" id="btn-entrega" onclick="setDelivery('Entrega')">Entrega</button>
        </div>
      </div>

      <div id="address-box" style="display:none">
        <div class="form-section">
          <label class="form-label">Rua</label>
          <input type="text" id="addr-rua" placeholder="Rua">
        </div>
        <div class="form-row">
          <div class="form-section">
            <label class="form-label">Número</label>
            <input type="text" id="addr-num" placeholder="Número" inputmode="numeric">
          </div>
          <div class="form-section">
            <label class="form-label">Bairro</label>
            <input type="text" id="addr-bairro" placeholder="Bairro">
          </div>
        </div>
        <div class="form-section">
          <label class="form-label">Complemento (opcional)</label>
          <input type="text" id="addr-comp" placeholder="Complemento">
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">Observações (opcional)</label>
        <textarea id="obs" placeholder="Ex: Sem cebola, capricha no molho..." rows="2"></textarea>
      </div>

      <button id="finish-order-btn" class="btn-finish">Enviar pedido pelo WhatsApp</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const demoBrand = params.get('demo');
    const isBobsDemo = demoBrand === 'bobs';
    const isTropicalDemo = demoBrand === 'tropical';

    if (isBobsDemo) {
      document.title = "Cardápio | Bob's Burgue";
      document.querySelector('meta[property="og:title"]').setAttribute('content', "Cardápio Bob's Burgue");
      document.querySelector('meta[property="og:description"]').setAttribute('content', "Hamburgueria artesanal, restaurante e marmitex em Várzea da Palma - MG");
      document.querySelector('meta[property="og:image"]').setAttribute('content', './assets/logo-bobs.svg');
      document.getElementById('brand-logo').src = './assets/logo-bobs.svg';
      document.getElementById('brand-logo').alt = "Logo Bob's Burgue";
      document.getElementById('restaurant-name').textContent = "Bob's Burgue";
    }

    if (isTropicalDemo) {
      document.title = "Cardápio | Tropical Açaí e Lanches";
      document.querySelector('meta[property="og:title"]').setAttribute('content', 'Cardápio Tropical Açaí e Lanches');
      document.querySelector('meta[property="og:description"]').setAttribute('content', 'Açaí, sorvetes, lanches, macarrão na chapa e porções em Várzea da Palma - MG');
      document.querySelector('meta[property="og:image"]').setAttribute('content', './assets/logo-tropical.svg');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#7B1FA2');
      document.documentElement.style.setProperty('--gold', '#F5C542');
      document.documentElement.style.setProperty('--gold-light', '#FFE27A');
      document.documentElement.style.setProperty('--gold-dark', '#B48A00');
      document.documentElement.style.setProperty('--accent', '#7B1FA2');
      document.getElementById('brand-logo').src = './assets/logo-tropical.svg';
      document.getElementById('brand-logo').alt = 'Logo Tropical Açaí e Lanches';
      document.getElementById('restaurant-name').textContent = 'Tropical Açaí e Lanches';
    }
  </script>

  <script src="./js/config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/menu.js"></script>
  <script>
    const demoBrandTimer = setInterval(() => {
      if (typeof currentRestaurant !== 'undefined' && currentRestaurant) {
        if (isBobsDemo) {
          currentRestaurant.name = "Bob's Burgue";
          document.getElementById('restaurant-name').textContent = "Bob's Burgue";
          document.getElementById('brand-logo').src = './assets/logo-bobs.svg';
        } else if (isTropicalDemo) {
          currentRestaurant.name = 'Tropical Açaí e Lanches';
          currentRestaurant.phone = '5538998612551';
          document.getElementById('restaurant-name').textContent = 'Tropical Açaí e Lanches';
          document.getElementById('brand-logo').src = './assets/logo-tropical.svg';
        } else {
          currentRestaurant.name = 'Dr. Espeto';
          document.getElementById('restaurant-name').textContent = 'Dr. Espeto';
        }
        clearInterval(demoBrandTimer);
      }
    }, 100);
  </script>
</body>
</html>
